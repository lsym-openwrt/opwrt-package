<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Background Pattern Preview</title>
<style>
body { background: #07070d; color: #fff; font-family: sans-serif; padding: 2rem; text-align: center; }
h1 { margin-bottom: 2rem; color: #9ca3af; }
.grid { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
.card { width: 400px; height: 300px; border: 1px solid #333; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.2s; }
.card:hover { transform: scale(1.02); border-color: #6366f1; }
.card img { width: 100%; height: 100%; object-fit: cover; }
.label { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: rgba(0,0,0,0.7); font-size: 14px; color: #e5e7eb; }
</style></head><body>
<h1>选择你喜欢的背景图案</h1>
<div class="grid">
  <div class="card"><img src="hex.svg"><div class="label">1. hex - 六边形网格</div></div>
  <div class="card"><img src="triangle.svg"><div class="label">2. triangle - 三角网格</div></div>
  <div class="card"><img src="polygon.svg"><div class="label">3. polygon - 不规则多边形</div></div>
  <div class="card"><img src="network.svg"><div class="label">4. network - 点线网络</div></div>
  <div class="card"><img src="voronoi.svg"><div class="label">5. voronoi - 泰森多边形</div></div>
</div>
</body></html>
