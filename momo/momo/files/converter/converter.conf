# momo 自动订阅转换插件配置（新增文件，不改动 /etc/config/momo）
# 依赖：python3-light（提供 python3 及 json/base64/re 等标准库，无需 python3-urllib）；
#       +curl（momo 原有依赖，分组驱动通过 Clash API 测速/切换）；sing-box >= 1.14
# 模板：/etc/momo/converter/momo-base.json，须保留 dns-in/redirect-in/tproxy-in/tun-in
#       inbound、fake-ip-dns-server DNS server 与 dns_resolver 解析器标签
# auto = 仅当所选 profile 不是原生 sing-box JSON 时自动转换（默认，原有行为不变）
# off  = 完全关闭自动转换
# on   = 与 auto 相同（保留供显式开启使用）
MOMO_CONVERTER_ENABLED=auto

# 骨架补齐：订阅（尤其机场给的 sing-box 原生配置）缺少 momo 必需的
# dns-in/redirect-in/tproxy-in/tun-in 与 fake-ip-dns-server 时自动补齐，
# 避免 momo 启动检查直接 "DNS inbound not found" 退出导致整网断流。
# 1 = 自动补齐（默认）；0 = 严格透传，缺什么就按原有方式报错退出
MOMO_CONVERTER_REPAIR=1

# 写入前调用 sing-box check 校验生成结果；校验失败则保留原文件
MOMO_CONVERTER_VALIDATE=1

# 留空时自动探测 /usr/bin/sing-box；也可指定绝对路径
MOMO_CONVERTER_SING_BOX=

# ===== User-Agent =====
# 机场按 UA 下发不同格式：Clash.Meta → Clash YAML（节点/分组/规则最全）、
# sing-box → JSON、v2rayN/Shadowrocket/PassWall → base64 URI 列表。
# 订阅正文由 /etc/init.d/momo 下载，UA 在 LuCI「订阅」里按条目设置，
# auto = 依次试探 clash.meta → sing-box → v2rayN → Shadowrocket → PassWall。
# 这里只控制 proxy-providers（Clash 模板里远程节点池）的下载 UA；
# provider 条目内自带 ua / user-agent / header.User-Agent 时以其为准。
MOMO_CONVERTER_PROVIDER_UA=clash.meta

# ===== 代理节点分组驱动（Clash/Mihomo 规则，不使用内核自动模式）=====
# 转换器把 url-test / fallback / load-balance / select 全部生成为 selector，
# 并把「测速地址、间隔、容差、超时、成员顺序、负载均衡策略」写入 groups.json；
# momo_groupd.py 通过 Clash API 自己测速并 PUT 切换，内核不参与自动选择。
# 成员仍可在面板手动选择：手动节点只要可用就一直保留，不可用立即切到可用节点，
# 恢复可用后自动切回。0/off 可完全关闭守护进程（不改变生成的 selector 分组）。
MOMO_GROUPD_ENABLED=1

# 分组规则 / 运行状态 / pid 文件（位于 tmpfs，重启后由转换器重新生成）
MOMO_GROUPD_RULES=/var/run/momo/groups.json
MOMO_GROUPD_STATE=/var/run/momo/group_state.json
MOMO_GROUPD_PID=/var/run/momo/groupd.pid

# 主循环间隔（秒）；当前节点快速健康检查间隔（秒）：故障无需等 interval 即切换
MOMO_GROUPD_TICK=2
MOMO_GROUPD_HEALTH_INTERVAL=15

# 仅当配置里没有 clash_api.external_controller 时，转换器注入此监听地址。
# 若 UCI mixin 里已配置 external_control_api_listen / secret，以其为准。
# 默认 0.0.0.0:15425：面板/分组驱动可直连，且不与常用 9090 端口冲突。
MOMO_CONVERTER_CLASH_API=0.0.0.0:15425
