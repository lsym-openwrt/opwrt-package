name: release-packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      # 版本号格式校验:防止 tag 名称/标题注入
      # 注意:经 env 传入而非 ${{ }} 直接插值到 run,避免注入面
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format (expected e.g. v1.0.0)." >&2
            exit 1
          fi

  build:
    name: Build packages
    needs: validate
    uses: ./.github/workflows/build-packages.yml

  release:
    name: Create release
    needs: [validate, build]
    runs-on: ubuntu-latest
    # 注意:job 级 permissions 会重置未列出的 scope,download-artifact 需要 actions: read
    permissions:
      contents: write
      actions: read
    
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Install the matching package on your router:
            - `luci-theme-rog-red-*.apk` -> OpenWrt LuCI 25.12+

              ```sh
              apk add --allow-untrusted luci-theme-rog-red-*.apk
              ```
            - `luci-theme-rog-red_*.ipk` -> OpenWrt LuCI 23.05~24.10

              ```sh
              opkg install luci-theme-rog-red_*.ipk
              ```
          files: |
            *.ipk
            *.apk
