<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- ROG 信仰红瞳孔渐变 -->
    <radialGradient id="rog-pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="55%" stop-color="#FF0018"/>
      <stop offset="100%" stop-color="#99000A"/>
    </radialGradient>
    <!-- 外环红色渐变 -->
    <linearGradient id="rog-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60012"/>
      <stop offset="100%" stop-color="#FF0018"/>
    </linearGradient>
  </defs>
  <!-- 深邃哑光黑底座 -->
  <circle cx="50" cy="50" r="50" fill="#0A0A0A"/>
  <!-- 外环 -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#rog-ring)" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FF0018" stroke-width="1" opacity="0.35"/>
  <!-- 眼睑轮廓(败家之眼极简 path) -->
  <path d="M15 46 C15 24 32 10 50 10 C68 10 85 24 85 46 C85 60 70 68 50 68 C30 68 15 60 15 46 Z" fill="none" stroke="#FF0018" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 瞳孔 -->
  <circle cx="50" cy="42" r="15" fill="url(#rog-pupil)"/>
  <circle cx="50" cy="42" r="15" fill="none" stroke="#FF0018" stroke-width="1.5"/>
  <!-- 高光 -->
  <circle cx="55" cy="37" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="46" cy="46" r="1.8" fill="#FFFFFF" opacity="0.5"/>
  <!-- ROG-OS 字样 -->
  <text x="50" y="86" text-anchor="middle" font-family="'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#E60012" letter-spacing="3">ROG-OS</text>
</svg>
