<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0B1A"/>
      <stop offset="30%" style="stop-color:#151030"/>
      <stop offset="55%" style="stop-color:#2D1B69"/>
      <stop offset="80%" style="stop-color:#1A1040"/>
      <stop offset="100%" style="stop-color:#0F1D3A"/>
    </linearGradient>
    <radialGradient id="lg1" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:0.12"/>
      <stop offset="50%" style="stop-color:#4A148C;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="lg2" cx="20%" cy="18%" r="35%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="lg3" cx="80%" cy="82%" r="30%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:0.09"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#lbg)"/>
  <rect width="1920" height="1080" fill="url(#lg1)"/>
  <rect width="1920" height="1080" fill="url(#lg2)"/>
  <rect width="1920" height="1080" fill="url(#lg3)"/>
  <!-- 中心六边形嵌套 -->
  <g opacity="0.06" fill="none" stroke-width="1" transform="translate(960,540)">
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" stroke="#00E5FF"/>
    <polygon points="0,-160 138.6,-80 138.6,80 0,160 -138.6,80 -138.6,-80" stroke="#7C4DFF" stroke-width="0.7"/>
    <polygon points="0,-220 190.5,-110 190.5,110 0,220 -190.5,110 -190.5,-110" stroke="#00E5FF" stroke-width="0.5"/>
  </g>
  <!-- 同心圆弧 -->
  <g opacity="0.05" fill="none">
    <circle cx="960" cy="540" r="200" stroke="#7C4DFF" stroke-width="0.8"/>
    <circle cx="960" cy="540" r="320" stroke="#00E5FF" stroke-width="0.6"/>
    <circle cx="960" cy="540" r="440" stroke="#7C4DFF" stroke-width="0.4"/>
    <circle cx="960" cy="540" r="560" stroke="#00E5FF" stroke-width="0.3"/>
  </g>
  <!-- 从中心放射的线条 -->
  <g opacity="0.035" stroke-width="0.5" fill="none">
    <line x1="960" y1="540" x2="960" y2="0" stroke="#7C4DFF"/>
    <line x1="960" y1="540" x2="1920" y2="540" stroke="#7C4DFF"/>
    <line x1="960" y1="540" x2="960" y2="1080" stroke="#7C4DFF"/>
    <line x1="960" y1="540" x2="0" y2="540" stroke="#7C4DFF"/>
    <line x1="960" y1="540" x2="1920" y2="0" stroke="#00E5FF"/>
    <line x1="960" y1="540" x2="0" y2="1080" stroke="#00E5FF"/>
    <line x1="960" y1="540" x2="1920" y2="1080" stroke="#00E5FF"/>
    <line x1="960" y1="540" x2="0" y2="0" stroke="#00E5FF"/>
  </g>
  <!-- 水平细线 -->
  <g opacity="0.03" stroke="#7C4DFF" stroke-width="0.5" fill="none">
    <line x1="200" y1="270" x2="1720" y2="270"/>
    <line x1="200" y1="810" x2="1720" y2="810"/>
  </g>
  <!-- 垂直细线 -->
  <g opacity="0.03" stroke="#00E5FF" stroke-width="0.5" fill="none">
    <line x1="480" y1="120" x2="480" y2="960"/>
    <line x1="1440" y1="120" x2="1440" y2="960"/>
  </g>
  <!-- 角落小六边形 -->
  <g opacity="0.06" fill="none" stroke-width="0.7">
    <polygon points="120,100 145,85 170,100 170,130 145,145 120,130" stroke="#00E5FF"/>
    <polygon points="1760,930 1785,915 1810,930 1810,960 1785,975 1760,960" stroke="#7C4DFF"/>
    <polygon points="100,900 118,890 136,900 136,920 118,930 100,920" stroke="#7C4DFF" stroke-width="0.5"/>
    <polygon points="1800,150 1818,140 1836,150 1836,170 1818,180 1800,170" stroke="#00E5FF" stroke-width="0.5"/>
  </g>
  <!-- 角落装饰三角 -->
  <g opacity="0.05" fill="none" stroke-width="0.6">
    <path d="M0,0 L100,0 L0,100 Z" stroke="#7C4DFF"/>
    <path d="M1920,1080 L1820,1080 L1920,980 Z" stroke="#00E5FF"/>
  </g>
</svg>
