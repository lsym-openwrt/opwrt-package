<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0B1A"/>
      <stop offset="35%" style="stop-color:#151030"/>
      <stop offset="60%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#0F1D3A"/>
    </linearGradient>
    <radialGradient id="g1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="75%" r="38%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g3" cx="55%" cy="10%" r="30%">
      <stop offset="0%" style="stop-color:#4A148C;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <!-- 斜线网格 -->
  <g opacity="0.06" stroke="#7C4DFF" stroke-width="0.8" fill="none">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="480" y1="0" x2="1920" y2="780"/>
    <line x1="0" y1="300" x2="1440" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="1440" y1="0" x2="0" y2="780"/>
    <line x1="1920" y1="300" x2="480" y2="1080"/>
  </g>
  <!-- 水平细线 -->
  <g opacity="0.05" stroke="#00E5FF" stroke-width="0.5" fill="none">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>
  <!-- 垂直细线 -->
  <g opacity="0.04" stroke="#7C4DFF" stroke-width="0.5" fill="none">
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  <!-- 六边形装饰 -->
  <g opacity="0.08" fill="none" stroke-width="1">
    <polygon points="300,180 360,150 420,180 420,240 360,270 300,240" stroke="#00E5FF"/>
    <polygon points="1500,750 1560,720 1620,750 1620,810 1560,840 1500,810" stroke="#7C4DFF"/>
    <polygon points="900,420 960,390 1020,420 1020,480 960,510 900,480" stroke="#00E5FF" stroke-width="0.7"/>
    <polygon points="200,700 240,680 280,700 280,740 240,760 200,740" stroke="#7C4DFF" stroke-width="0.7"/>
    <polygon points="1700,300 1740,280 1780,300 1780,340 1740,360 1700,340" stroke="#00E5FF" stroke-width="0.7"/>
  </g>
  <!-- 圆弧光圈 -->
  <g opacity="0.06" fill="none" stroke-width="0.8">
    <circle cx="280" cy="200" r="120" stroke="#7C4DFF"/>
    <circle cx="1640" cy="820" r="160" stroke="#00E5FF"/>
    <circle cx="960" cy="540" r="250" stroke="#7C4DFF" stroke-width="0.5"/>
    <circle cx="960" cy="540" r="380" stroke="#00E5FF" stroke-width="0.4"/>
    <circle cx="960" cy="540" r="500" stroke="#7C4DFF" stroke-width="0.3"/>
  </g>
  <!-- 角落装饰三角 -->
  <g opacity="0.07" fill="none" stroke-width="0.8">
    <path d="M0,0 L120,0 L0,120 Z" stroke="#00E5FF"/>
    <path d="M1920,1080 L1800,1080 L1920,960 Z" stroke="#7C4DFF"/>
    <path d="M1920,0 L1920,100 L1820,0 Z" stroke="#00E5FF" stroke-width="0.5"/>
    <path d="M0,1080 L0,980 L100,1080 Z" stroke="#7C4DFF" stroke-width="0.5"/>
  </g>
</svg>
