<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="asus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="50%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="asus-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring with glow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#asus-bg)" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <!-- Background -->
  <circle cx="50" cy="50" r="44" fill="#0A0E27"/>
  <!-- Inner circuit pattern -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00A8E8" stroke-width="0.5" opacity="0.2"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#0077B6" stroke-width="0.3" opacity="0.15"/>
  <!-- Central logo mark -->
  <g transform="translate(50,44)" filter="url(#glow)">
    <!-- WiFi/Router icon - stylized -->
    <path d="M-18 8 C-18 8 -12 -4 0 -10 C12 -4 18 8 18 8" fill="none" stroke="url(#asus-bg)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-12 4 C-12 4 -8 -2 0 -6 C8 -2 12 4 12 4" fill="none" stroke="#48CAE4" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 0 C-6 0 -3 -3 0 -4 C3 -3 6 0 6 0" fill="none" stroke="#90E0EF" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="2.5" fill="#00F5FF"/>
  </g>
  <!-- ASUS text -->
  <text x="50" y="78" text-anchor="middle" font-family="'Exo 2','Inter',sans-serif" font-size="11" font-weight="700" fill="url(#asus-bg)" letter-spacing="3">ASUS</text>
  <!-- Corner accents -->
  <path d="M10 10 L20 10" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M10 10 L10 20" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M90 10 L80 10" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M90 10 L90 20" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M10 90 L20 90" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M10 90 L10 80" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M90 90 L80 90" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
  <path d="M90 90 L90 80" stroke="#00A8E8" stroke-width="0.5" opacity="0.4"/>
</svg>